[project]
name = "ember"
version = "0.1.0"
description = "Self-hosted personal AI agent"
authors = [
    { name = "Jeremy Yunis", email = "jeremy@klinedrive.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "mcp[cli]>=1.2",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "watchfiles>=0.21",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "imap-tools>=1.5",
    "pyyaml>=6.0",
    "caldav>=1.3",
    "vobject>=0.9",
    "schwab-py>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
# Libraries for the agent's own `python3` in the Bash tool (not imported by
# Ember). The claude subprocess inherits PATH with /app/.venv/bin first, so
# only venv packages are visible there — a system-site or `pip --user`
# install is invisible. Installed in the image via `uv sync --extra sandbox`.
sandbox = [
    "pillow>=10",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlsx2csv>=0.8",
]

[project.scripts]
ember = "ember.main:run"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
